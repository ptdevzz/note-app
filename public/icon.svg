<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e112a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle App Icon Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#f43f5e" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.2" />

  <!-- Central Romantic Heart Icon -->
  <g filter="url(#glow)">
    <path d="M256 420c-8 0-16-4-22-10C110 290 64 240 64 176c0-62 48-112 108-112 40 0 76 22 96 56 20-34 56-56 96-56 60 0 108 50 108 112 0 64-46 114-170 234-6 6-14 10-22 10z" fill="url(#heartGrad)"/>
  </g>
  
  <!-- Sparkles -->
  <circle cx="160" cy="140" r="10" fill="#ffffff" opacity="0.8"/>
  <circle cx="360" cy="180" r="8" fill="#fdba74" opacity="0.9"/>
  <circle cx="370" cy="130" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
